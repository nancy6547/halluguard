[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "halluguard-nli"
version = "0.2.0"
description = "Flag the sentences in a RAG answer that its sources don't support (NLI cross-encoder), benchmarked on RAGTruth."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Nancy Singh" }]
requires-python = ">=3.10"
dependencies = ["sentence-transformers>=2.7", "pandas>=2.0", "pyarrow>=14", "huggingface_hub>=0.20"]

keywords = ["rag", "hallucination", "nli", "llm", "evaluation"]
classifiers = ["Programming Language :: Python :: 3", "License :: OSI Approved :: MIT License", "Topic :: Scientific/Engineering :: Artificial Intelligence"]

[project.urls]
Homepage = "https://github.com/nancy6547/halluguard"
Demo = "https://halluguard-ak4qp46x8utv6muwu3mgcd.streamlit.app/"

[project.optional-dependencies]
app = ["streamlit>=1.35"]
dev = ["pytest>=8"]

[project.scripts]
halluguard = "halluguard.cli:main"

[tool.setuptools]
packages = ["halluguard"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
